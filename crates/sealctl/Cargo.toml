[package]
name = "sealctl"
description = "Hardware-wallet backed encryption for everyday developer use: volumes, backups, secrets, SSH"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
readme = "../../README.md"
keywords = ["openpgp", "ledger", "encryption", "smartcard", "cli"]
categories = ["command-line-utilities", "cryptography"]

[dependencies]
sealctl-ledger = { path = "../sealctl-ledger", version = "0.1.0" }
anyhow.workspace = true
log.workspace = true
openpgp-card.workspace = true
openpgp-card-rpgp.workspace = true
pgp.workspace = true
clap.workspace = true
clap_complete = "4.6"
env_logger.workspace = true
tokio = { workspace = true, features = ["net", "macros", "signal"] }
ssh-agent-lib = "0.6"
ssh-key = { version = "0.6", default-features = false, features = ["std", "ed25519"] }
serde = { version = "1", features = ["derive"] }
toml = "0.9"
zeroize = "1"
getrandom = "0.3"
rand = "0.8"
sha2 = "0.10"
hex = "0.4"
rpassword = "7"

[dev-dependencies]
tempfile = "3"
