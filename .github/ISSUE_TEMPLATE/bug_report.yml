name: Bug report
description: Something doesn't work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        **Security issue?** Don't file it here — see SECURITY.md.
        Never paste PINs, passphrases, seeds or decrypted secrets.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Command you ran, what you expected, what happened instead.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: sealctl version
      placeholder: output of `sealctl --version`
    validations:
      required: true
  - type: dropdown
    id: transport
    attributes:
      label: Transport
      options: [USB, Bluetooth, both]
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device and OpenPGP app
      placeholder: "Ledger Flex, OpenPGP 3.2.0 (official / Bluetooth build)"
  - type: input
    id: os
    attributes:
      label: OS
      placeholder: "macOS 26.1 / Ubuntu 26.04"
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Output with `-v`. `-vv` prints raw APDUs — review before pasting.
      render: text
