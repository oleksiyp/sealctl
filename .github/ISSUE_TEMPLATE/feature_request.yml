name: Feature request
description: Suggest an idea
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Remember the project rule — standard tools and formats only, no custom cryptography.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
